name = "anu-wiki"
main = "worker/index.ts"
compatibility_date = "2025-01-01"

[assets]
not_found_handling = "404-page"
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

[env.production]
vars = { SITE_NAME = "ANU Wiki" }

# 运行时文章层（R254，d1_runtime_scaffold 生成）。只存还没进构建产物的
# 新文章，静态正本优先。刻意不设 run_worker_first：Worker 只接管构建产物里
# 根本不存在的路径（云构建等价闸按 dist manifest 逐文件核 sha256）。
[[d1_databases]]
binding = "DB"
database_name = "anu-wiki-content"
database_id = "4324a31f-6b5b-4d2a-9c5f-b702d9546e8e"
